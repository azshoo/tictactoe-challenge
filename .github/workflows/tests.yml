name: UI tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Download the app under test
        run: curl -fsSL "$AUT_APK_URL" -o app-under-test.apk
        env:
          AUT_APK_URL: ${{ secrets.AUT_APK_URL }}

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: ./gradlew connectedDebugAndroidTest -Paut=app-under-test.apk -PignoreTestFailures

      - uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: Test results
          report_paths: app/build/outputs/androidTest-results/connected/debug/*.xml
          detailed_summary: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/connected_android_test_additional_output/
