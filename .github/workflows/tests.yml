name: UI tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_7

      - name: Create the AVD and a snapshot for the cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Download the app under test
        run: curl -fsSL "$AUT_APK_URL" -o app-under-test.apk
        env:
          AUT_APK_URL: ${{ secrets.AUT_APK_URL }}

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The events log records why the system kills a process; it is kept for diagnosing launch problems.
          script: ./gradlew connectedDebugAndroidTest -Paut=app-under-test.apk -PignoreTestFailures; status=$?; adb logcat -b events -d > events-logcat.txt; exit $status

      - uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: Test results
          report_paths: app/build/outputs/androidTest-results/connected/debug/*.xml
          detailed_summary: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/connected_android_test_additional_output/
            events-logcat.txt
